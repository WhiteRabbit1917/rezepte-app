name: Android APK bauen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: projekt.zip entpacken (überschreibt alte Dateien)
        run: |
          if [ -f projekt.zip ]; then unzip -o -q projekt.zip; fi
          test -f www/index.html
          grep -o "App-Stand: [^<]*" www/index.html || echo "Hinweis: kein App-Stand gefunden"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Android-Projekt frisch anlegen
        run: |
          rm -rf android
          npx cap add android

      - name: Signatur, Version und Farben setzen
        run: python3 patch.py
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Icons und Startbild erzeugen
        run: npx --yes @capacitor/assets generate --android

      - name: Web-App in Android kopieren
        run: npx cap sync android

      - name: APK bauen
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Meine-Rezepte.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Meine-Rezepte-APK
          path: Meine-Rezepte.apk

      - name: Release mit APK erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Meine Rezepte (Build ${{ github.run_number }})
          files: Meine-Rezepte.apk
